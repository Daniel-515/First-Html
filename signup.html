<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login or Sign Up - EnviroTech Recycling</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Navbar -->
<header class="bg-gradient-to-r from-green-700 via-gray-700 to-blue-600 text-white p-4 flex justify-between items-center shadow-md">
  <h1 class="text-2xl font-bold">EnviroTech Recycling</h1>
  <nav>
    <ul class="flex gap-6 text-lg">
      <li><a href="index.html" class="hover:underline">Home</a></li>
      <li><a href="shop.html" class="hover:underline">Shop</a></li>
      <li><a href="sell.html" class="hover:underline">Sell Waste</a></li>
      <li><a href="services.html" class="hover:underline">Services</a></li>
      <li><a href="contact.html" class="hover:underline">Contact</a></li>
    </ul>
  </nav>
</header>

<!-- Sign Up Section -->
<section class="p-10">
  <h2 class="text-4xl font-bold text-center mb-8">Create a New Account</h2>
  <div class="flex flex-col md:flex-row justify-center items-center gap-12">
    
    <!-- Sign Up Form -->
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h3 class="text-2xl font-semibold mb-6 text-blue-700">Sign Up</h3>
      <form>
        <input type="text" placeholder="First Name" class="w-full mb-4 px-4 py-2 border rounded-lg">
        <input type="text" placeholder="Last Name" class="w-full mb-4 px-4 py-2 border rounded-lg">
        <input type="email" placeholder="Gmail" class="w-full mb-4 px-4 py-2 border rounded-lg">
        <input type="text" placeholder="Username" class="w-full mb-4 px-4 py-2 border rounded-lg">
        <input type="text" placeholder="Address" class="w-full mb-4 px-4 py-2 border rounded-lg">
        <input type="password" placeholder="Password" class="w-full mb-4 px-4 py-2 border rounded-lg">
        <input type="password" placeholder="Confirm Password" class="w-full mb-6 px-4 py-2 border rounded-lg">
        <button class="bg-blue-700 text-white px-6 py-2 rounded-lg w-full">Create Account</button>
        <br>

        <a href="login.html" class="login-button">Already have an account? Login</a>

<style>
  .login-button {
    display: inline-block;
    padding: 10px 80px;
    background-color: white; /* Green color */
    color: black;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
  }

  .login-button:hover {
    text-decoration: underline;
  }
</style>

  </div>
</section>

<!-- Footer -->
<footer class="bg-green-700 text-white text-center p-4 mt-12">

</footer>
